<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album výměny – PokéTrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ═══ WALLPAPER BACKGROUND ═══ */
body { background: #06040c !important; overflow-x: hidden; }
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("wallpaper.png");
  background-size: cover;
  background-position: center 30%;
  background-repeat: no-repeat;
  filter: brightness(0.22) saturate(0.6);
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 60%, rgba(255,80,0,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 60%, rgba(30,80,255,0.08) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.6) 100%);
}
/* ── App-clone layout ────────────────────────────────────────────────────── */
body { background: #0a0a0f; overflow-x: hidden; }

/* Tapeta – tmavý fire gradient jako v aplikaci */
.app-wallpaper {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 60% 40%, rgba(180,40,10,0.45) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 20% 80%, rgba(120,20,0,0.3)  0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 10%, rgba(200,80,0,0.2)  0%, transparent 60%),
    #0a0a0f;
}
.app-wallpaper::after {
  content: '';
  position: absolute; inset: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="1" fill="rgba(255,255,255,0.03)"/></svg>') repeat;
}

/* ── Top app-bar (jako aplikace) ─────────────────────────────────────────── */
.app-topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(8,8,12,0.88);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  display: flex; align-items: center; gap: 0;
  height: 56px; padding: 0 16px;
}
.app-logo {
  font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 800;
  color: #fff; display: flex; align-items: center; gap: 8px;
  text-decoration: none; margin-right: 24px; white-space: nowrap;
}
.app-logo span { color: var(--yellow); }
.app-logo img  { width: 28px; height: 28px; border-radius: 6px; }

.nav-lnks { display: flex; gap: 2px; flex: 1; }
.nav-lnks a {
  padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--text2); text-decoration: none; transition: all .15s;
}
.nav-lnks a:hover  { background: rgba(255,255,255,0.07); color: var(--text); }
.nav-lnks a.active { background: rgba(245,200,66,0.12); color: var(--yellow); }

.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.user-chip {
  text-decoration: none; color: var(--text, #f0ece4); transition: all .15s;
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 4px 12px 4px 6px;
  font-size: 13px; color: var(--text);
}
.user-chip:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.14); }
.user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--yellow); color: #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  background-size: cover; background-position: center; overflow: hidden; flex-shrink: 0;
}
.app-sync-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text2); border-radius: 8px; padding: 5px 12px; font-size: 12px;
  cursor: pointer; font-family: inherit; transition: all .15s;
  display: flex; align-items: center; gap: 6px;
}
.app-sync-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--text3);
  transition: background .3s;
}
.sync-dot.ok      { background: #22c55e; }
.sync-dot.syncing { background: var(--yellow); animation: blink .8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── View toggle ───────────────────────────────────────────── */
.view-toggle {
  display: flex; gap: 4px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 3px;
}
.vt-btn {
  padding: 5px 12px; border-radius: 7px; border: none;
  background: transparent; color: var(--text3); font-size: 12px;
  cursor: pointer; font-family: inherit; transition: all .15s;
  display: flex; align-items: center; gap: 5px;
}
.vt-btn:hover { color: var(--text2); }
.vt-btn.active { background: rgba(245,200,66,0.15); color: var(--yellow); }

/* ── Sort select ───────────────────────────────────────────── */
.sort-select {
  padding: 6px 10px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05); color: var(--text2);
  font-family: inherit; font-size: 12px; cursor: pointer; outline: none;
  color-scheme: dark;
}
.sort-select option { background: #0e0c14; color: #f0ece4; }
.sort-select optgroup { background: #0a0810; color: rgba(240,236,228,0.45); font-style: normal; }

/* ── Album book ─────────────────────────────────────────────── */
.album-book { display: none; }
.album-book.visible { display: block; }
.cards-grid.hidden { display: none; }

.book-wrap {
  background: linear-gradient(160deg, #1a1208 0%, #0e0c06 100%);
  border: 1px solid rgba(245,200,66,0.15); border-radius: 16px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
}
.book-size-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(0,0,0,0.2);
}
.book-size-row label { font-size: 11px; color: var(--text3); white-space: nowrap; }
.book-size-row input[type=range] { flex: 1; max-width: 180px; }
.book-size-val { font-size: 11px; color: var(--text2); min-width: 30px; }
.book-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: rgba(0,0,0,0.4);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.book-page-info {
  font-family: 'Unbounded', sans-serif; font-size: 11px;
  color: rgba(245,200,66,0.7); letter-spacing: .08em;
}
.book-nav-btn {
  display: flex; align-items: center; gap: 6px;
  background: rgba(245,200,66,0.08); border: 1px solid rgba(245,200,66,0.2);
  color: rgba(245,200,66,0.8); border-radius: 8px; padding: 5px 14px;
  font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s;
}
.book-nav-btn:hover:not(:disabled) { background: rgba(245,200,66,0.18); color: var(--yellow); }
.book-nav-btn:disabled { opacity: .3; cursor: default; }
.book-pages {
  display: grid; grid-template-columns: 1fr 1fr; min-height: 480px;
  --book-scale: 1;
}
.book-page {
  padding: 20px 16px 24px; position: relative;
}
.book-page:first-child {
  border-right: 2px solid rgba(0,0,0,0.6);
  background: linear-gradient(to right, rgba(245,200,66,0.02) 0%, transparent 100%);
}
.book-page:last-child {
  background: linear-gradient(to left, rgba(245,200,66,0.02) 0%, transparent 100%);
}
.page-number {
  position: absolute; bottom: 8px; font-size: 10px;
  color: rgba(255,255,255,0.15); font-family: 'Unbounded', sans-serif;
}
.book-page:first-child .page-number { right: 14px; }
.book-page:last-child  .page-number { left: 14px; }
.book-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr); gap: 6px;
}
.book-card {
  position: relative; border-radius: 8px; overflow: hidden;
  aspect-ratio: 63/88; min-width: 0;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s;
}
.book-card:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); border-color: rgba(245,200,66,0.4); z-index: 2;
}
.book-card.trade { border-color: rgba(74,158,255,0.5); }
.book-card.sell  { border-color: rgba(34,197,94,0.5); }
.book-card.both  { border-color: rgba(245,200,66,0.5); }
.book-card img   { width: 100%; height: 100%; object-fit: cover; display: block; }
.book-card .card-footer {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 16px 5px 4px;
}
.book-card .card-name { font-size: 8px; font-weight: 700; color: #fff; line-height: 1.2; }
.book-card .card-sub  { font-size: 7px; color: rgba(255,255,255,0.4); margin-top: 1px; }
.book-card .trade-badge {
  position: absolute; top: 3px; right: 3px;
  display: flex; flex-direction: column; gap: 2px; align-items: flex-end;
}
.book-card .badge-pill { font-size: 7px; font-weight: 800; padding: 1px 4px; border-radius: 4px; }
.book-card-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 6px;
}
.book-card-placeholder .emoji { font-size: 22px; }
.book-card-placeholder .name  { font-size: 8px; color: var(--text2); text-align: center; }
.book-card-empty {
  border-radius: 8px; aspect-ratio: 63/88;
  background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.06);
}
.book-spine {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
  transform: translateX(-50%);
  background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.8) 20%,
    rgba(0,0,0,0.9) 50%, rgba(0,0,0,0.8) 80%, transparent);
  pointer-events: none; z-index: 5;
}

/* ── Card detail modal ─────────────────────────────────────── */
#cardDetailModal {
  display: none; position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,0.82); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; padding: 20px;
}
#cardDetailModal.open { display: flex; }
.cd-box {
  background: #0e0c12; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; width: 100%; max-width: 680px;
  display: flex; overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7); max-height: 90vh; position: relative;
}
.cd-left {
  flex: 0 0 260px; background: rgba(0,0,0,0.4);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 28px 20px; gap: 14px;
  border-right: 1px solid rgba(255,255,255,0.07);
}
.cd-img { width: 100%; max-width: 220px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); transition: transform .2s; }
.cd-img:hover { transform: scale(1.04); }
.cd-no-img {
  width: 180px; height: 252px; border-radius: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; color: var(--text3); font-size: 13px;
}
.cd-no-img .big-emoji { font-size: 48px; }
.cd-right {
  flex: 1; padding: 24px 24px 20px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
}
.cd-close {
  position: absolute; top: 16px; right: 18px;
  background: rgba(255,255,255,0.08); border: none; border-radius: 8px;
  color: var(--text2); font-size: 16px; cursor: pointer; padding: 5px 10px;
}
.cd-close:hover { background: rgba(255,255,255,0.15); }
.cd-name { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 800; color: #fff; line-height: 1.2; }
.cd-set  { font-size: 12px; color: var(--text3); }
.cd-badges { display: flex; gap: 6px; flex-wrap: wrap; }
.cd-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.cd-badge.trade { background: rgba(74,158,255,0.2); color: #74b4ff; border: 1px solid rgba(74,158,255,0.3); }
.cd-badge.sell  { background: rgba(34,197,94,0.2);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
.cd-badge.cond  { background: rgba(245,200,66,0.1); color: var(--yellow); border: 1px solid rgba(245,200,66,0.2); }
.cd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cd-row { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 8px 10px; }
.cd-row-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.cd-row-val   { font-size: 13px; color: var(--text); font-weight: 500; }
.cd-row.wide  { grid-column: 1 / -1; }

@media (max-width: 768px) {
  .book-pages { grid-template-columns: 1fr; }
  .book-page:first-child { border-right: none; border-bottom: 2px solid rgba(0,0,0,0.6); }
  .cd-box { flex-direction: column; }
  .cd-left { flex: none; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.07); padding: 16px; }
}

/* ── Page wrapper ────────────────────────────────────────────────────────── */
.page-wrap { position: relative; z-index: 1; display: flex; min-height: calc(100vh - 56px); }

/* ── Left sidebar (jako aplikace) ────────────────────────────────────────── */
.side-panel {
  width: 200px; flex-shrink: 0;
  background: rgba(8,8,12,0.7);
  border-right: 1px solid rgba(255,255,255,0.05);
  padding: 16px 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
}
.side-section { padding: 0 10px 16px; }
.side-label {
  font-size: 10px; font-weight: 700; letter-spacing: .12em;
  color: var(--text3); text-transform: uppercase;
  padding: 0 6px; margin-bottom: 6px; display: block;
}
.side-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 7px 10px; border-radius: 8px; border: none;
  background: transparent; color: var(--text2); font-size: 13px;
  font-family: inherit; cursor: pointer; text-align: left; transition: all .15s;
}
.side-btn:hover  { background: rgba(255,255,255,0.05); color: var(--text); }
.side-btn.active { background: rgba(245,200,66,0.12); color: var(--yellow); font-weight: 600; }
.side-btn .cnt   { font-size: 11px; opacity: .6; }

.side-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 8px 10px 12px; }

/* ── Main content ────────────────────────────────────────────────────────── */
.main-content { flex: 1; padding: 20px; min-width: 0; }

/* ── Top filter bar (typ karet – jako aplikace) ──────────────────────────── */
.type-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px; padding: 8px 12px; margin-bottom: 16px;
}
.type-chip {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.08); background: transparent;
  color: var(--text2); cursor: pointer; font-family: inherit; transition: all .15s;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
}
.type-icon { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
.type-chip:hover  { background: rgba(255,255,255,0.07); color: var(--text); }
.type-chip.active { background: rgba(245,200,66,0.15); border-color: rgba(245,200,66,0.3); color: var(--yellow); }

/* ── Search + stats row ─────────────────────────────────────────────────── */
.toolbar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
}
.search-box {
  flex: 1; min-width: 200px; position: relative;
}
.search-box input {
  width: 100%; padding: 8px 14px 8px 36px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px;
  outline: none; transition: border-color .15s;
}
.search-box input:focus { border-color: rgba(245,200,66,0.4); }
.search-box::before {
  content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 13px; pointer-events: none;
}
.stats-chips { display: flex; gap: 8px; }
.stat-chip {
  padding: 6px 12px; border-radius: 8px; font-size: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  color: var(--text2); white-space: nowrap;
}
.stat-chip strong { color: var(--yellow); font-family: 'Unbounded', sans-serif; font-size: 13px; }

/* Stránkování */
.page-info {
  font-size: 12px; color: var(--text3); padding: 4px 8px;
  background: rgba(255,255,255,0.03); border-radius: 6px;
}

/* ── Karta grid (klon aplikace) ──────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 10px;
}

.card-slot {
  position: relative; border-radius: 10px; overflow: hidden;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: transform .15s, border-color .15s;
  aspect-ratio: 63/88;
}
.card-slot:hover { transform: translateY(-3px) scale(1.02); border-color: rgba(255,255,255,0.14); }
.card-slot.trade { border-color: rgba(74,158,255,0.5); }
.card-slot.sell  { border-color: rgba(34,197,94,0.5); }
.card-slot.both  { border-color: rgba(245,200,66,0.5); }

/* Obrázek karty */
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 8px;
  background: rgba(255,255,255,0.03);
}
.card-placeholder .emoji { font-size: 28px; }
.card-placeholder .name  { font-size: 10px; color: var(--text2); text-align: center; line-height: 1.3; }
.card-placeholder .set   { font-size: 9px; color: var(--text3); text-align: center; }

/* Badge k výměně – vpravo nahoře */
.trade-badge {
  position: absolute; top: 5px; right: 5px; z-index: 2;
  display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
}
.badge-pill {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px;
  letter-spacing: .03em; line-height: 1.4; backdrop-filter: blur(4px);
  white-space: nowrap;
}
.badge-trade { background: rgba(74,158,255,0.85); color: #fff; }
.badge-sell  { background: rgba(34,197,94,0.85);  color: #fff; }
.badge-price { background: rgba(0,0,0,0.75); color: var(--yellow); border: 1px solid rgba(245,200,66,0.3); }

/* Info pod kartou */
.card-footer {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  padding: 20px 6px 5px;
}
.card-name { font-size: 10px; font-weight: 600; color: #fff; line-height: 1.2; }
.card-sub  { font-size: 9px; color: rgba(255,255,255,0.5); margin-top: 1px; }

/* Prázdný stav */
.empty-state-app {
  grid-column: 1/-1; text-align: center; padding: 60px 20px;
  color: var(--text3);
}
.empty-state-app .icon { font-size: 52px; margin-bottom: 14px; }
.empty-state-app h3 { font-size: 16px; color: var(--text2); margin-bottom: 8px; }
.empty-state-app p  { font-size: 13px; line-height: 1.6; }

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg,
    rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 10px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Login prompt */
.login-prompt {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh; gap: 16px; color: var(--text2); text-align: center; padding: 40px;
}
.login-prompt .icon { font-size: 56px; }
.login-prompt h2 { font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); }
.login-prompt p  { font-size: 14px; color: var(--text3); max-width: 360px; }

@media (max-width: 768px) {
  .side-panel { display: none; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
}



.nav-icon { width:26px; height:26px; object-fit:contain; vertical-align:middle; margin-right:5px; mix-blend-mode:screen; filter:brightness(1.3); }

</style>
</head>
<body>

<div class="app-wallpaper"></div>

<!-- Top bar -->
<header class="app-topbar">

<script src="app.js"></script>
<script>
function doLogout() {
  ['sb_token','sb_user_id','sb_username','sb_refresh','sb_user','sb_refresh_token'].forEach(function(k){localStorage.removeItem(k)});
  location.href = 'login.html';
}
</script>
<script>
// ── Stav ────────────────────────────────────────────────────────────────────
let allCards = [], filtered = [];
let activeFilter = 'all', activeType = '', activeCond = '';
const SYNC_MODE_KEY = 'pkc_album_sync_mode';
const LAST_SYNC_KEY = 'pkc_album_last_sync';

// ── Načti avatar z Supabase profiles ────────────────────────────────────────
async function loadAvatarAlbum(uid, token) {
  try {
    const res = await supabaseRequest(
      `rest/v1/profiles?id=eq.${uid}&select=avatar_url`,
      'GET', null, token
    );
    if (!Array.isArray(res) || !res[0]?.avatar_url) return;
    const el = document.getElementById('userAvatar');
    el.textContent = '';
    el.style.cssText += ';padding:0;overflow:hidden';
    const img = document.createElement('img');
    img.src = res[0].avatar_url;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%';
    img.onerror = () => {};
    el.appendChild(img);
  } catch(e) { /* tiché selhání */ }
}

// ── Init ────────────────────────────────────────────────────────────────────
(async () => {
  const token   = localStorage.getItem('sb_token');
  // login.html ukládá uživatele jako JSON objekt do 'sb_user'
  const _sbUser = (() => { try { return JSON.parse(localStorage.getItem('sb_user') || 'null'); } catch { return null; } })();
  const userId  = _sbUser?.id || localStorage.getItem('sb_user_id');
  const uname   = _sbUser?.user_metadata?.username || _sbUser?.email?.split('@')[0] || localStorage.getItem('sb_username') || '';

  if (token && userId) {
    document.getElementById('userChip').style.display = '';
    document.getElementById('loginLink').style.display  = 'none';
    document.getElementById('logoutBtn').style.display  = '';
    document.getElementById('userName').textContent     = uname;
    document.getElementById('userAvatar').textContent   = (uname[0] || '?').toUpperCase();
    // Load avatar from localStorage
    (function(){
      try {
        var av=localStorage.getItem('pkc_avatar_local');
        var el=document.getElementById('userAvatar');
        if(av&&el){el.textContent='';el.style.backgroundImage='url('+av+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center';}
      } catch(e){}
    })();
    // Načti profilový avatar z Supabase profiles
    loadAvatarAlbum(userId, token);
  }

  // Nastav sync mode select
  const mode = localStorage.getItem(SYNC_MODE_KEY) || 'hourly';
  document.getElementById('syncModeSelect').value = mode;
  updateLastSyncInfo();

  // Zkontroluj URL param ?user=UUID (cizí album)
  const params  = new URLSearchParams(location.search);
  const viewUID = params.get('user') || userId;

  if (!viewUID) {
    showLoginPrompt();
    return;
  }

  await loadAlbum(viewUID, token);

  // Auto-sync pokud vlastní album
  if (!params.get('user') && token) autoSync(mode);
})();

// ── Načti album ze Supabase ──────────────────────────────────────────────────
async function loadAlbum(userId, token) {
  setSyncState('syncing', 'Načítám…');
  try {
    const res = await supabaseRequest(
      `rest/v1/user_cards?user_id=eq.${userId}&select=local_id,card_data,for_trade,for_sell,price_czk,updated_at&order=updated_at.desc`,
      'GET', null, token
    );
    if (res._err || (res.message && res.code)) throw new Error(res.message || res._err);

    allCards = (Array.isArray(res) ? res : []).map(r => ({
      ...r.card_data,
      id:        r.local_id,
      for_trade: r.for_trade,
      for_sell:  r.for_sell,
      price_czk: r.price_czk,
      updated_at:r.updated_at,
    }));

    updateCounts();
    render();
    setSyncState('ok', 'Synchronizováno');
  } catch(err) {
    setSyncState('', 'Chyba: ' + err.message);
    console.error(err);
  }
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();

  filtered = allCards.filter(c => {
    if (activeFilter === 'trade' && !c.for_trade) return false;
    if (activeFilter === 'sell'  && !c.for_sell)  return false;
    if (activeType && !matchType(c, activeType))   return false;
    if (activeCond && c.condition !== activeCond)  return false;
    if (q && !((c.name||'').toLowerCase().includes(q) ||
               (c.set||'').toLowerCase().includes(q)  ||
               (c.number||'').toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('statCount').textContent = allCards.length;
  document.getElementById('statTrade').textContent = allCards.filter(c => c.for_trade).length;
  document.getElementById('statSell').textContent  = allCards.filter(c => c.for_sell).length;
  document.getElementById('pageInfo').textContent  = filtered.length + ' karet';

  if (filtered.length === 0) {
    document.getElementById('cardsGrid').innerHTML = `
      <div class="empty-state-app">
        <div class="icon">${activeFilter==='all'?'🎴':'🔍'}</div>
        <h3>${activeFilter==='all' ? 'Žádné karty' : 'Žádné karty k '+(activeFilter==='trade'?'výměně':'prodeji')}</h3>
        <p>${activeFilter==='all'
          ? 'Album je prázdné. Přidej karty v aplikaci a synchronizuj.'
          : 'Označ karty v aplikaci jako "K výměně" nebo "K prodeji".'}
        </p>
      </div>`;
    return;
  }

  document.getElementById('cardsGrid').innerHTML = filtered.map(renderCard).join('');
}

function renderCard(c) {
  const img       = c.images?.small || c.apiSmall || c.imageUrl || '';
  const emoji     = typeEmoji(c.types?.[0] || c.type || c.supertype || '');
  const isTrade   = c.for_trade;
  const isSell    = c.for_sell;
  const cls       = isTrade && isSell ? 'both' : isTrade ? 'trade' : isSell ? 'sell' : '';

  return `
    <div class="card-slot ${cls}" title="${esc(c.name||'?')}">
      ${img
        ? `<img class="card-img" src="${esc(img)}" alt="${esc(c.name||'')}" loading="lazy">`
        : `<div class="card-placeholder">
             <div class="emoji">${emoji}</div>
             <div class="name">${esc(c.name||'?')}</div>
             <div class="set">${esc(c.set||'')}</div>
           </div>`}

      <div class="trade-badge">
        ${isTrade ? '<span class="badge-pill badge-trade">K výměně</span>' : ''}
        ${isSell  ? '<span class="badge-pill badge-sell">K prodeji</span>'  : ''}
        ${isSell && c.price_czk ? `<span class="badge-pill badge-price">${c.price_czk} Kč</span>` : ''}
      </div>

      <div class="card-footer">
        <div class="card-name">${esc(c.name||'?')}</div>
        <div class="card-sub">${esc(c.set||'')} ${c.number ? '#'+esc(c.number) : ''} · ${esc(c.condition||'NM')}</div>
      </div>
    </div>`;
}

// ── Filtry ────────────────────────────────────────────────────────────────────
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('[id^="fb-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('fb-' + f)?.classList.add('active');
  render();
}
function setType(t) {
  activeType = t;
  document.querySelectorAll('.type-chip').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(t === '' ? 'Vše' : t) && (t==='' ? b.textContent==='Vše' : true));
  });
  render();
}
function setCond(c) {
  activeCond = c;
  document.querySelectorAll('.side-panel .side-btn').forEach(b => {
    if (b.getAttribute('onclick')?.includes('setCond'))
      b.classList.toggle('active', b.getAttribute('onclick').includes("'"+c+"'"));
  });
  render();
}

function updateCounts() {
  document.getElementById('cnt-all').textContent   = allCards.length;
  document.getElementById('cnt-trade').textContent = allCards.filter(c => c.for_trade).length;
  document.getElementById('cnt-sell').textContent  = allCards.filter(c => c.for_sell).length;
}

// ── Sync ──────────────────────────────────────────────────────────────────────
async function manualSync() {
  const token   = localStorage.getItem('sb_token');
  const _su2    = (() => { try { return JSON.parse(localStorage.getItem('sb_user') || 'null'); } catch { return null; } })();
  const userId  = _su2?.id || localStorage.getItem('sb_user_id');
  if (!userId || !token) return;
  setSyncState('syncing', 'Synchronizuji…');
  await loadAlbum(userId, token);
  localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
  updateLastSyncInfo();
}

function autoSync(mode) {
  if (mode === 'hourly')   setInterval(manualSync, 60 * 60 * 1000);
  if (mode === 'realtime') setInterval(manualSync, 30_000);
}

function changeSyncMode(mode) {
  localStorage.setItem(SYNC_MODE_KEY, mode);
  // Restartovat auto-sync by vyžadovalo reload – stačí info
  updateLastSyncInfo();
}

function setSyncState(state, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (state ? ' ' + state : '');
  document.getElementById('syncLabel').textContent = label;
}

function updateLastSyncInfo() {
  const t = localStorage.getItem(LAST_SYNC_KEY);
  const el = document.getElementById('lastSyncInfo');
  if (t) {
    const d = new Date(t);
    el.textContent = 'Naposledy: ' + d.toLocaleTimeString('cs');
  } else {
    el.textContent = 'Ještě nesynchronizováno';
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function logout() {
  ['sb_token','sb_user_id','sb_username','sb_refresh','sb_user','sb_refresh_token'].forEach(k => localStorage.removeItem(k));
  location.href = 'login.html';
}

function showLoginPrompt() {
  document.getElementById('cardsGrid').innerHTML = `
    <div class="login-prompt">
      <div class="icon">🔐</div>
      <h2>Přihlaš se pro zobrazení alba</h2>
      <p>Album výměny je dostupné po přihlášení. Karty k výměně označíš v aplikaci.</p>
      <a href="login.html" class="btn-primary" style="margin-top:8px">Přihlásit se →</a>
    </div>`;
  document.getElementById('typeBar').style.display = 'none';
}

function matchType(c, type) {
  const t = [c.type, ...(c.types || [])].map(x => (x||'').toLowerCase());
  return t.some(x => x.includes(type.toLowerCase()));
}

function typeEmoji(t) {
  const m = { fire:'🔥', water:'💧', grass:'🌿', lightning:'⚡', electric:'⚡',
    psychic:'🔮', darkness:'🌑', dark:'🌑', dragon:'🐉', metal:'⚙️', steel:'⚙️',
    fighting:'👊', colorless:'⚪', fairy:'🌸', poison:'☠️', normal:'⬜' };
  return m[(t||'').toLowerCase()] || '🎴';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══ SORT ══════════════════════════════════════════════════════════
const ELEMENT_ORDER = ['fire','water','grass','lightning','psychic','darkness','dragon',
  'metal','fighting','fairy','bug','poison','ground','ghost','ice','normal','flying','rock','colorless'];

let activeSort = localStorage.getItem('pkc_album_sort') || 'added';

(function restoreSort() {
  const sel = document.getElementById('sortSelect');
  if (sel) sel.value = activeSort;
})();

function setSort(val) {
  activeSort = val;
  localStorage.setItem('pkc_album_sort', val);
  render();
  if (bookViewMode === 'book') { bookCurrentPage = 0; renderBookView(); }
}

function getCardElement(c) {
  const t = ((c.types?.[0] || c.type || '')).toLowerCase();
  for (const e of ELEMENT_ORDER) if (t.includes(e)) return e;
  return 'other';
}

function sortCards(cards) {
  const c = [...cards];
  if (activeSort === 'added')   return c;
  if (activeSort === 'name_az') return c.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'cs'));
  if (activeSort === 'name_za') return c.sort((a,b) => (b.name||'').localeCompare(a.name||'', 'cs'));
  if (activeSort === 'number')  return c.sort((a,b) => {
    const na = parseInt((a.number||'0').replace(/[^0-9]/g,'')) || 0;
    const nb = parseInt((b.number||'0').replace(/[^0-9]/g,'')) || 0;
    return na - nb || (a.name||'').localeCompare(b.name||'', 'cs');
  });
  if (activeSort === 'series')  return c.sort((a,b) =>
    (a.set||'').localeCompare(b.set||'', 'cs') || (a.name||'').localeCompare(b.name||'', 'cs'));
  if (activeSort === 'element') return c.sort((a,b) => {
    const ea = ELEMENT_ORDER.indexOf(getCardElement(a));
    const eb = ELEMENT_ORDER.indexOf(getCardElement(b));
    return (ea<0?99:ea)-(eb<0?99:eb) || (a.name||'').localeCompare(b.name||'', 'cs');
  });
  return c;
}

function buildBookPages(cards) {
  if (activeSort !== 'element') return cards;
  const PGSZ = 9;
  const groups = {}, order = [];
  for (const c of cards) {
    const el = getCardElement(c);
    if (!groups[el]) { groups[el] = []; order.push(el); }
    groups[el].push(c);
  }
  const result = [];
  for (const el of order) {
    const rem = result.length % PGSZ;
    if (rem !== 0 && result.length > 0)
      for (let i = 0; i < PGSZ - rem; i++) result.push(null);
    result.push(...groups[el]);
  }
  return result;
}

// ══ BOOK VIEW ═════════════════════════════════════════════════════
const BOOK_CARDS_PER_PAGE = 18;
const BOOK_PAGE_SIZE = 9;
let bookViewMode = 'grid';
let bookCurrentPage = 0;
let bookFilteredCards = [];
let bookSize = parseInt(localStorage.getItem('pkc_album_book_size') || '100');

function setViewMode(mode) {
  bookViewMode = mode;
  localStorage.setItem('pkc_album_view_mode', mode);
  document.getElementById('vt-grid').classList.toggle('active', mode === 'grid');
  document.getElementById('vt-book').classList.toggle('active', mode === 'book');
  document.getElementById('cardsGrid').classList.toggle('hidden', mode === 'book');
  document.getElementById('albumBook').classList.toggle('visible', mode === 'book');
  if (mode === 'book') { bookCurrentPage = 0; renderBookView(); initBookSize(); }
}

function bookPrevPage() {
  if (bookCurrentPage > 0) { bookCurrentPage--; renderBookView(); }
}
function bookNextPage() {
  const total = Math.ceil(bookFilteredCards.length / BOOK_CARDS_PER_PAGE);
  if (bookCurrentPage < total - 1) { bookCurrentPage++; renderBookView(); }
}

function renderBookView() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  let raw = allCards.filter(c => {
    if (activeFilter === 'trade' && !c.for_trade) return false;
    if (activeFilter === 'sell'  && !c.for_sell)  return false;
    if (activeType && !matchType(c, activeType))   return false;
    if (activeCond && c.condition !== activeCond)  return false;
    if (q && !((c.name||'').toLowerCase().includes(q) ||
               (c.set||'').toLowerCase().includes(q)  ||
               (c.number||'').toLowerCase().includes(q))) return false;
    return true;
  });
  raw = sortCards(raw);
  bookFilteredCards = buildBookPages(raw);

  const totalSpreads = Math.max(1, Math.ceil(bookFilteredCards.length / BOOK_CARDS_PER_PAGE));
  bookCurrentPage = Math.min(bookCurrentPage, totalSpreads - 1);

  document.getElementById('bookPageInfo').textContent =
    'Strana ' + (bookCurrentPage*2+1) + '–' + (bookCurrentPage*2+2) + ' / ' + (totalSpreads*2);
  document.getElementById('bookPrev').disabled = bookCurrentPage === 0;
  document.getElementById('bookNext').disabled = bookCurrentPage >= totalSpreads-1;

  const startIdx = bookCurrentPage * BOOK_CARDS_PER_PAGE;
  const spread   = bookFilteredCards.slice(startIdx, startIdx + BOOK_CARDS_PER_PAGE);
  const left = spread.slice(0, 9); while (left.length  < 9) left.push(null);
  const right= spread.slice(9,18); while (right.length < 9) right.push(null);

  function renderBookCard(c) {
    if (!c) return '<div class="book-card-empty"></div>';
    const img   = c.images?.small || c.apiSmall || c.imageUrl || '';
    const emoji = typeEmoji(c.types?.[0] || c.type || '');
    const cls   = c.for_trade && c.for_sell ? 'both' : c.for_trade ? 'trade' : c.for_sell ? 'sell' : '';
    return `<div class="book-card ${cls}" onclick="cardDetailOpen('${esc(String(c.id||c.name))}')">
      ${img ? `<img src="${esc(img)}" alt="${esc(c.name||'')}" loading="lazy">`
            : `<div class="book-card-placeholder"><div class="emoji">${emoji}</div><div class="name">${esc(c.name||'?')}</div></div>`}
      <div class="trade-badge">
        ${c.for_trade?'<span class="badge-pill badge-trade">🔄</span>':''}
        ${c.for_sell ?'<span class="badge-pill badge-sell">💰</span>':''}
      </div>
      <div class="card-footer">
        <div class="card-name">${esc(c.name||'?')}</div>
        <div class="card-sub">${esc(c.set||'')}${c.number?' #'+esc(c.number):''}</div>
      </div>
    </div>`;
  }

  document.getElementById('bookPages').innerHTML = `
    <div class="book-spine"></div>
    <div class="book-page">
      <div class="book-grid">${left.map(renderBookCard).join('')}</div>
      <div class="page-number">${bookCurrentPage*2+1}</div>
    </div>
    <div class="book-page">
      <div class="book-grid">${right.map(renderBookCard).join('')}</div>
      <div class="page-number">${bookCurrentPage*2+2}</div>
    </div>`;
}

function setBookSize(val) {
  bookSize = parseInt(val);
  localStorage.setItem('pkc_album_book_size', bookSize);
  document.getElementById('bookSizeVal').textContent = bookSize + '%';
  document.getElementById('bookPages').style.setProperty('--book-scale', bookSize/100);
  document.getElementById('bookPages').style.fontSize = (bookSize/100) + 'em';
}

function initBookSize() {
  const slider = document.getElementById('bookSizeSlider');
  if (slider) { slider.value = bookSize; setBookSize(bookSize); }
}

// ══ CARD DETAIL ════════════════════════════════════════════════════
// Album výměny je read-only — detail jen zobrazí info
function cardDetailOpen(id) {
  const c = allCards.find(x => String(x.id||x.name) === String(id)) || filtered.find(x => String(x.id||x.name) === String(id));
  if (!c) return;
  const modal = document.getElementById('cardDetailModal');
  const img = c.images?.large || c.images?.small || c.apiSmall || c.imageUrl || '';
  const emoji = typeEmoji(c.types?.[0] || c.type || '');
  document.getElementById('cdImgWrap').innerHTML = img
    ? `<img class="cd-img" src="${esc(img)}" alt="${esc(c.name||'')}">`
    : `<div class="cd-no-img"><div class="big-emoji">${emoji}</div><div>${esc(c.name||'?')}</div></div>`;
  document.getElementById('cdName').textContent = c.name || '?';
  document.getElementById('cdSet').textContent  = [c.set, c.number?'#'+c.number:''].filter(Boolean).join(' · ');
  const cond = c.condition || 'NM';
  const badges = [];
  if (c.for_trade) badges.push('<span class="cd-badge trade">🔄 K výměně</span>');
  if (c.for_sell)  badges.push('<span class="cd-badge sell">💰 K prodeji</span>');
  badges.push(`<span class="cd-badge cond">${cond}</span>`);
  document.getElementById('cdBadges').innerHTML = badges.join('');
  const rows = [
    ['Typ',     c.types?.join(', ') || c.type || '—'],
    ['Série',   c.set || '—'],
    ['Číslo',   c.number || '—'],
    ['Stav',    cond],
    ['HP',      c.hp || '—'],
    ['Cena',    c.price_czk ? c.price_czk + ' Kč' : '—', false],
    ['Supertyp',c.supertype || c.category || '—'],
    ['Počet',   c.count || 1],
  ];
  document.getElementById('cdGrid').innerHTML = rows.map(([label, val, wide]) =>
    `<div class="cd-row${wide?' wide':''}">
       <div class="cd-row-label">${label}</div>
       <div class="cd-row-val">${esc(String(val))}</div>
     </div>`).join('');
  modal.classList.add('open');
  modal.onclick = e => { if (e.target === modal) closeCardDetail(); };
}

function closeCardDetail() {
  document.getElementById('cardDetailModal').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCardDetail(); });

// ══ PATCH render() to sort + update book view ══════════════════════
const _origRender = render;
render = function() {
  _origRender();
  if (bookViewMode === 'book') renderBookView();
};

// ══ PATCH renderCard to open detail on click ══════════════════════
const _origRenderCard = renderCard;
renderCard = function(c) {
  const html = _origRenderCard(c);
  const id = esc(String(c.id||c.name||''));
  return html.replace('<div class="card-slot', `<div onclick="cardDetailOpen('${id}')" class="card-slot`);
};

// ══ RESTORE saved view mode + sort after data loaded ══════════════
(function restoreViewMode() {
  const mode = localStorage.getItem('pkc_album_view_mode') || 'grid';
  if (mode === 'book') {
    // Wait for data then switch
    const check = setInterval(() => {
      if (allCards.length > 0) { clearInterval(check); setViewMode('book'); }
    }, 100);
  }
})();
</script>
