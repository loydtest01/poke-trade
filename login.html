<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přihlášení – PokéTrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-icon">⚡</span><span>Poké<strong>Trade</strong></span></a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">⚡</div>
      <h1>Přihlásit se</h1>
      <p>Vítej zpět, trenére!</p>
    </div>

    <div id="authError" class="auth-error" style="display:none"></div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="tvuj@email.cz" required>
      </div>
      <div class="form-group">
        <label>Heslo</label>
        <div class="input-password-wrap"><input type="password" id="loginPassword" placeholder="Tvoje heslo" required><button type="button" class="eye-btn" onclick="toggleEye('loginPassword',this)">👁️</button></div>
      </div>
      <button type="submit" class="btn-primary btn-full" id="loginBtn">
        <span id="loginBtnText">Přihlásit se</span>
        <span id="loginBtnLoad" style="display:none">⏳ Přihlašuji...</span>
      </button>
    </form>

    <div class="auth-divider"><span>nebo</span></div>
    <div class="auth-alt">Nemáš účet? <a href="register.html">Registrovat se →</a></div>
    <div class="auth-alt" style="margin-top:.5rem"><a href="reset-password.html">🔑 Zapomenuté heslo?</a></div>

    <div class="auth-note">
      💡 Stejné přihlašovací údaje fungují v nastavení aplikace PokémonCards.
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
// Příznak: právě probíhá přihlášení formulářem → checkAlreadyLoggedIn nesmí mazat tokeny
let loginInProgress = false;

// Pokud je uživatel JIŽ přihlášen s platným tokenem → přesměruj na dashboard
(async function checkAlreadyLoggedIn() {
  const token        = localStorage.getItem('sb_token');
  const refreshToken = localStorage.getItem('sb_refresh_token');
  const user         = (() => { try { return JSON.parse(localStorage.getItem('sb_user') || 'null'); } catch { return null; } })();
  if (!token || !user?.id) return; // nejsme přihlášeni – zůstaň na login

  // Ověř token u Supabase (může být expirovaný)
  try {
    const res = await supabaseRequest('auth/v1/user', 'GET', null, token);
    if (loginInProgress) return; // formulář právě běží – nedotýkej se localStorage
    if (res?.id) {
      window.location.href = 'dashboard.html'; // platný token → přesměruj
      return;
    }
    // Token expirovaný – zkus refresh
    if (refreshToken) {
      const r = await supabaseRequest('auth/v1/token?grant_type=refresh_token', 'POST', { refresh_token: refreshToken });
      if (loginInProgress) return;
      if (r?.access_token) {
        localStorage.setItem('sb_token', r.access_token);
        if (r.refresh_token) localStorage.setItem('sb_refresh_token', r.refresh_token);
        window.location.href = 'dashboard.html';
        return;
      }
    }
    // Obě metody selhaly – vymaž pouze pokud formulář neběží
    if (!loginInProgress) {
      ['sb_token','sb_user','sb_refresh_token','sb_user_id'].forEach(k => localStorage.removeItem(k));
    }
  } catch { /* síťová chyba – zůstaň na login */ }
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  loginInProgress = true;
  setLoading(true);
  const errEl = document.getElementById('authError');
  errEl.style.display = 'none';

  // Vymaž staré tokeny před novým přihlášením (čistý start)
  ['sb_token','sb_user','sb_refresh_token','sb_user_id'].forEach(k => localStorage.removeItem(k));

  try {
    const res = await supabaseRequest('auth/v1/token?grant_type=password', 'POST', { email, password });

    // Detailní chybové hlášky
    if (res.error || res.error_description) {
      const msg = res.error_description || res.error?.message || res.error || 'Špatný e-mail nebo heslo';
      throw new Error(msg);
    }
    if (!res.access_token) throw new Error('Nepodařilo se přihlásit – zkus to znovu');

    // Uložit tokeny
    localStorage.setItem('sb_token', res.access_token);
    if (res.refresh_token) localStorage.setItem('sb_refresh_token', res.refresh_token);

    // Načíst uživatele
    let user = res.user;
    if (!user?.id) {
      const userRes = await supabaseRequest('auth/v1/user', 'GET', null, res.access_token);
      if (userRes?.id) user = userRes;
    }
    if (!user?.id) throw new Error('Přihlášení proběhlo, ale nepodařilo se načíst profil – zkus znovu');

    localStorage.setItem('sb_user', JSON.stringify(user));
    await new Promise(r => setTimeout(r, 50));
    window.location.href = 'dashboard.html';

  } catch(err) {
    loginInProgress = false;
    errEl.textContent = '\u26a0\ufe0f ' + err.message;
    errEl.style.display = 'block';
    setLoading(false);
  }
});

function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  btn.textContent = show ? "🙈" : "👁️";
  btn.classList.toggle("active", show);
}

function setLoading(on) {
  document.getElementById('loginBtnText').style.display = on ? 'none' : '';
  document.getElementById('loginBtnLoad').style.display = on ? '' : 'none';
  document.getElementById('loginBtn').disabled = on;
}
</script>
</body>
</html>
