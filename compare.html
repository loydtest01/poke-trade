<style>
/* ═══ WALLPAPER BACKGROUND ═══ */
body { background: #06040c !important; overflow-x: hidden; }
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: url("wallpaper.png");
  background-size: cover;
  background-position: center 30%;
  background-repeat: no-repeat;
  filter: brightness(0.22) saturate(0.6);
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 60%, rgba(255,80,0,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 60%, rgba(30,80,255,0.08) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.6) 100%);
}
/* ── Chat dropdown ikona + panel ── */
.chat-dropdown-wrap { position: relative; }
.chat-icon-btn {
  position: relative; display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text2, rgba(240,236,228,0.65));
  text-decoration: none; transition: all .15s; cursor: pointer; font-family: inherit;
}
.chat-icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text, #f0ece4); border-color: rgba(255,255,255,0.14); }
.chat-badge {
  position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px;
  border-radius: 9px; background: #f87171; color: #fff;
  font-size: 10px; font-weight: 800; display: flex; align-items: center;
  justify-content: center; padding: 0 5px; line-height: 1;
  box-shadow: 0 0 0 2px rgba(8,8,12,0.92);
}
.chat-drop {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  width: 380px; max-height: 480px; background: rgba(14,12,20,0.97);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
  backdrop-filter: blur(20px); box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  z-index: 300; overflow: hidden; flex-direction: column;
}
.chat-drop.open { display: flex; }
.chat-drop-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.chat-drop-title { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 800; color: #fff; }
.chat-drop-all { font-size: 12px; color: var(--yellow, #f5c842); text-decoration: none; font-weight: 600; }
.chat-drop-all:hover { opacity: 0.8; }
.chat-drop-list { overflow-y: auto; max-height: 400px; padding: 4px 0; }
.chat-drop-list::-webkit-scrollbar { width: 4px; }
.chat-drop-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
.chat-drop-empty { text-align: center; padding: 30px 16px; color: rgba(240,236,228,0.35); font-size: 13px; }
.cdrop-item {
  display: flex; gap: 10px; padding: 10px 16px; cursor: pointer;
  transition: background .12s; text-decoration: none; color: inherit; border-left: 3px solid transparent;
}
.cdrop-item:hover { background: rgba(255,255,255,0.04); }
.cdrop-item.unread { background: rgba(245,200,66,0.06); border-left-color: var(--yellow, #f5c842); }
.cdrop-avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  background: rgba(245,200,66,0.12); border: 1px solid rgba(245,200,66,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: var(--yellow, #f5c842);
}
.cdrop-info { flex: 1; min-width: 0; }
.cdrop-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
.cdrop-name { font-size: 13px; font-weight: 600; color: var(--text, #f0ece4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cdrop-item.unread .cdrop-name { color: #fff; }
.cdrop-time { font-size: 11px; flex-shrink: 0; color: rgba(240,236,228,0.35); }
.cdrop-item.unread .cdrop-time { color: var(--yellow, #f5c842); }
.cdrop-msg { font-size: 12px; color: rgba(240,236,228,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cdrop-item.unread .cdrop-msg { color: rgba(240,236,228,0.7); font-weight: 500; }
.cdrop-listing { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: rgba(245,200,66,0.7); margin-top: 3px; }
.cdrop-listing-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(245,200,66,0.5); }
.cdrop-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow, #f5c842); flex-shrink: 0; align-self: center; }
.notif-prompt { display: none; padding: 10px 16px; background: rgba(74,158,255,0.08); border-top: 1px solid rgba(74,158,255,0.15); font-size: 12px; color: rgba(240,236,228,0.65); gap: 8px; align-items: center; }
.notif-prompt.show { display: flex; }
.notif-prompt-btn { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }
.notif-allow { background: rgba(245,200,66,0.2); color: var(--yellow, #f5c842); }
.notif-dismiss { background: transparent; color: rgba(240,236,228,0.4); border: 1px solid rgba(255,255,255,0.08); }
@media (max-width: 480px) { .chat-drop { width: calc(100vw - 20px); right: -60px; } }
</style>

<body>

  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-icon">⚡</span><span>Poké<strong>Trade</strong></span></a>
    <div class="nav-links">
      <a href="marketplace.html" class="nav-link">Nabídky</a>
      <a href="album.html" class="nav-link">🔄 Album výměny</a>

<div class="compare-page">
  <div class="container">
    <div class="compare-header">
      <h1>Porovnat dvě alba</h1>
      <p>Nahraj dvě <code>.pktr</code> zálohy a hned uvidíš průniky a rozdíly.</p>
    </div>

    <!-- UPLOAD ZONE -->
    <div class="compare-upload-row">
      <div class="compare-drop" id="drop1"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleDrop(event,1)">
        <div class="cd-inner">
          <div class="cd-icon">📂</div>
          <div class="cd-label" id="label1">Album A</div>
          <small>Přetáhni .pktr nebo .pkte</small>
          <label class="btn-ghost">
            Vybrat soubor
            <input type="file" accept=".pktr,.pkte" onchange="handleFile(event,1)" style="display:none">
          </label>
        </div>
      </div>

      <div class="compare-vs">VS</div>

      <div class="compare-drop" id="drop2"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleDrop(event,2)">
        <div class="cd-inner">
          <div class="cd-icon">📂</div>
          <div class="cd-label" id="label2">Album B</div>
          <small>Přetáhni .pktr nebo .pkte</small>
          <label class="btn-ghost">
            Vybrat soubor
            <input type="file" accept=".pktr,.pkte" onchange="handleFile(event,2)" style="display:none">
          </label>
        </div>
      </div>
    </div>

    <div id="compareResults" style="display:none">

      <!-- STATS BAR -->
      <div class="compare-stats" id="compareStats"></div>

      <!-- TABS -->
      <div class="compare-tabs">
        <button class="ct-tab active" onclick="showTab('both',this)">✅ Máte oba</button>
        <button class="ct-tab" onclick="showTab('only1',this)">🟦 Jen Album A</button>
        <button class="ct-tab" onclick="showTab('only2',this)">🟨 Jen Album B</button>
        <button class="ct-tab" onclick="showTab('all',this)">📋 Vše</button>
      </div>
      <div id="compareGrid" class="compare-grid"></div>

    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
let albumA = null;
let albumB = null;

async function handleDrop(e, num) {
  e.preventDefault();
  document.getElementById('drop' + num).classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) await parseAlbum(file, num);
}
async function handleFile(e, num) {
  const file = e.target.files[0];
  if (file) await parseAlbum(file, num);
}

async function parseAlbum(file, num) {
  document.getElementById('label' + num).textContent = '⏳ Čtu soubor...';

  try {
    const buffer  = await file.arrayBuffer();
    const zipFiles = await readZip(buffer);
    const payload  = JSON.parse(new TextDecoder().decode(zipFiles['data.json']));
    const cards    = payload.cards || [];

    if (num === 1) albumA = { name: file.name.replace(/\.(pktr|pkte)$/,''), cards };
    else           albumB = { name: file.name.replace(/\.(pktr|pkte)$/,''), cards };

    document.getElementById('label' + num).textContent = `✅ ${cards.length} karet`;
    document.getElementById('drop' + num).classList.add('loaded');

    if (albumA && albumB) runCompare();
  } catch(err) {
    document.getElementById('label' + num).textContent = '❌ Chyba';
    alert('Chyba při čtení souboru: ' + err.message);
  }
}

function runCompare() {
  const idsA = new Set(albumA.cards.map(c => String(c.tcgId || c.apiId || c.id)));
  const idsB = new Set(albumB.cards.map(c => String(c.tcgId || c.apiId || c.id)));

  // Fallback: match by name if no api ID
  const namesA = new Set(albumA.cards.map(c => normalizeCardName(c)));
  const namesB = new Set(albumB.cards.map(c => normalizeCardName(c)));

  const both  = albumA.cards.filter(c => idsB.has(String(c.tcgId||c.apiId||c.id)) || namesB.has(normalizeCardName(c)));
  const only1 = albumA.cards.filter(c => !idsB.has(String(c.tcgId||c.apiId||c.id)) && !namesB.has(normalizeCardName(c)));
  const only2 = albumB.cards.filter(c => !idsA.has(String(c.tcgId||c.apiId||c.id)) && !namesA.has(normalizeCardName(c)));

  window._compareData = { both, only1, only2, all: [...albumA.cards, ...albumB.cards] };

  document.getElementById('compareStats').innerHTML = `
    <div class="cstat green"><span>${both.length}</span><small>Máte oba</small></div>
    <div class="cstat blue"><span>${only1.length}</span><small>Jen ${albumA.name}</small></div>
    <div class="cstat yellow"><span>${only2.length}</span><small>Jen ${albumB.name}</small></div>
    <div class="cstat gray"><span>${albumA.cards.length + albumB.cards.length}</span><small>Celkem karet</small></div>
  `;

  document.getElementById('compareResults').style.display = '';
  showTab('both', document.querySelector('.ct-tab'));
}

function normalizeCardName(c) {
  return (c.name || '').toLowerCase().replace(/\s+/g,'').substring(0,20);
}

function showTab(key, btn) {
  document.querySelectorAll('.ct-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const cards = window._compareData?.[key] || [];
  renderCompareCards(cards, key);
}

function renderCompareCards(cards, key) {
  const grid = document.getElementById('compareGrid');
  if (!cards.length) {
    grid.innerHTML = '<p class="empty-state">Žádné karty v této kategorii</p>';
    return;
  }

  const colorMap = { both: 'green', only1: 'blue', only2: 'yellow', all: '' };
  const color = colorMap[key] || '';

  grid.innerHTML = cards.slice(0, 200).map(card => {
    const img = card.images?.small || card.apiSmall || '';
    return `
      <div class="cc-item ${color}">
        <div class="cc-img">
          ${img
            ? `<img src="${img}" alt="${card.name||'?'}" loading="lazy">`
            : `<div class="cc-placeholder">${getTypeEmoji(card.types?.[0])}</div>`
          }
        </div>
        <div class="cc-name">${card.name || '?'}</div>
        ${card.set ? `<div class="cc-set">${card.set}</div>` : ''}
      </div>
    `;
  }).join('');

  if (cards.length > 200) {
    grid.innerHTML += `<div class="compare-more">Zobrazeno 200 z ${cards.length} karet</div>`;
  }
}
</script>

<script>
/* ── Chat Dropdown + Notifikace ── */
(function(){
  'use strict';
  var POLL=8000;
  var SBU=typeof SUPABASE_URL!=='undefined'?SUPABASE_URL:'https://xrduqwrinzvmpixgmqta.supabase.co';
  var SBA=typeof SUPABASE_ANON!=='undefined'?SUPABASE_ANON:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyZHVxd3Jpbnp2bXBpeGdtcXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI0MjksImV4cCI6MjA5MDk3ODQyOX0.2p404Vy77CH_MsvQlnpxaO0H-KlSSt_oJlaFrmttFXs';
  var tk=localStorage.getItem('sb_token');
  var su=(function(){try{return JSON.parse(localStorage.getItem('sb_user')||'null')}catch(e){return null}})();
  if(!tk||!su||!su.id)return;
  var uid=su.id,convs=[],prevUn=0,dropO=false;
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmtT(iso){if(!iso)return'';var d=new Date(iso),n=new Date(),df=n-d;if(df<60000)return'teď';if(df<3600000)return Math.floor(df/60000)+' min';if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit'});var y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'včera';return d.toLocaleDateString('cs',{day:'numeric',month:'numeric'})}
  async function sbF(p){try{var r=await fetch(SBU+'/'+p,{headers:{'Content-Type':'application/json','apikey':SBA,'Authorization':'Bearer '+tk}});var d=await r.json();return Array.isArray(d)?d:[]}catch(e){return[]}}
  window.toggleChatDrop=function(){var dr=document.getElementById('chatDrop');if(!dr)return;dropO=!dropO;dr.classList.toggle('open',dropO);if(dropO)renderDrop()};
  document.addEventListener('click',function(e){var w=document.getElementById('chatDropWrap');if(w&&!w.contains(e.target)&&dropO){dropO=false;var dr=document.getElementById('chatDrop');if(dr)dr.classList.remove('open')}});
  function renderDrop(){
    var list=document.getElementById('chatDropList');if(!list)return;
    if(!convs.length){list.innerHTML='<div class="chat-drop-empty"><div style="font-size:24px;margin-bottom:6px;opacity:0.4">💬</div><div>Žádné zprávy</div></div>';return}
    list.innerHTML=convs.slice(0,8).map(function(c){
      var isU1=c.user1_id===uid,partner=isU1?c.user2_username:c.user1_username;
      var un=isU1?(c.unread_user1||0):(c.unread_user2||0);
      var ini=(partner||'?')[0].toUpperCase(),msg=c.last_message_text||'Nová konverzace',tm=fmtT(c.last_message_at);
      var hasL=msg.indexOf('📎')>=0||msg.indexOf('Nabídka')>=0;
      return '<a class="cdrop-item'+(un>0?' unread':'')+'" href="chat.html?conv='+c.id+'">'
        +'<div class="cdrop-avatar">'+esc(ini)+'</div>'
        +'<div class="cdrop-info"><div class="cdrop-top"><div class="cdrop-name">'+esc(partner)+'</div><div class="cdrop-time">'+esc(tm)+'</div></div>'
        +'<div class="cdrop-msg">'+esc(msg)+'</div>'
        +(hasL?'<div class="cdrop-listing"><div class="cdrop-listing-dot"></div> Nabídka z marketplace</div>':'')
        +'</div>'+(un>0?'<div class="cdrop-unread-dot"></div>':'')+'</a>'
    }).join('');
    if(window.Notification&&Notification.permission==='default'&&!localStorage.getItem('pkt_notif_dismissed')&&!document.getElementById('notifPrompt')){
      var pr=document.createElement('div');pr.className='notif-prompt show';pr.id='notifPrompt';
      pr.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(74,158,255,0.7)" stroke-width="2" style="flex-shrink:0"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span style="flex:1">Oznámení o nových zprávách?</span><button class="notif-prompt-btn notif-allow" onclick="requestNotifPerm()">Povolit</button><button class="notif-prompt-btn notif-dismiss" onclick="dismissNotifPrompt()">Ne</button>';
      document.getElementById('chatDrop').appendChild(pr)
    }
  }
  window.requestNotifPerm=async function(){if(!window.Notification)return;await Notification.requestPermission();var p=document.getElementById('notifPrompt');if(p)p.remove()};
  window.dismissNotifPrompt=function(){localStorage.setItem('pkt_notif_dismissed','1');var p=document.getElementById('notifPrompt');if(p)p.remove()};
  function showNotif(title,body){if(!window.Notification||Notification.permission!=='granted')return;try{var n=new Notification(title,{body:body,icon:'pokemon.png',tag:'poketrade-msg',renotify:true});n.onclick=function(){window.focus();window.location.href='chat.html';n.close()};setTimeout(function(){n.close()},6000)}catch(e){}}
  async function poll(){
    convs=await sbF('rest/v1/conversations?or=(user1_id.eq.'+uid+',user2_id.eq.'+uid+')&order=last_message_at.desc&limit=15');
    var tot=convs.reduce(function(s,c){return s+(c.user1_id===uid?(c.unread_user1||0):(c.unread_user2||0))},0);
    var bg=document.getElementById('chatBadge');
    if(bg){if(tot>0){bg.textContent=tot>99?'99+':tot;bg.style.display=''}else{bg.style.display='none'}}
    if(tot>prevUn&&prevUn>=0&&document.hidden){
      var nc=convs.find(function(c){var u=c.user1_id===uid?(c.unread_user1||0):(c.unread_user2||0);return u>0&&c.last_sender_id!==uid});

    }
    prevUn=tot;
    if(dropO)renderDrop();
    if(tot>0){var bt=document.title.replace(/^\(\d+\)\s*/,'');document.title='('+tot+') '+bt}else{document.title=document.title.replace(/^\(\d+\)\s*/,'')}
  }
  poll();setInterval(poll,POLL);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
})();
</script>
