<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obnovit heslo – PokéTrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-icon">⚡</span><span>Poké<strong>Trade</strong></span></a>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔑</div>
      <h1 id="pageTitle">Obnovit heslo</h1>
      <p id="pageSubtitle">Zadej svůj e-mail a pošleme ti odkaz</p>
    </div>

    <div id="authError"   class="auth-error"   style="display:none"></div>
    <div id="authSuccess" class="auth-success"  style="display:none"></div>

    <!-- KROK 1: Zadej email -->
    <form id="requestForm" class="auth-form">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="resetEmail" placeholder="tvuj@email.cz" required>
      </div>
      <button type="submit" class="btn-primary btn-full" id="requestBtn">
        <span id="requestBtnText">Poslat odkaz</span>
        <span id="requestBtnLoad" style="display:none">⏳ Odesílám...</span>
      </button>
    </form>

    <!-- KROK 2: Nové heslo (zobrazí se po kliknutí na odkaz v emailu) -->
    <form id="newPasswordForm" class="auth-form" style="display:none">
      <div class="form-group">
        <label>Nové heslo</label>
        <div class="input-password-wrap">
          <input type="password" autocomplete="new-password" id="newPassword" placeholder="Minimálně 6 znaků" required minlength="6">
          <button type="button" class="eye-btn" onclick="toggleEye('newPassword',this)">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Nové heslo znovu</label>
        <div class="input-password-wrap">
          <input type="password" autocomplete="new-password" id="newPasswordConfirm" placeholder="Zopakuj heslo" required minlength="6">
          <button type="button" class="eye-btn" onclick="toggleEye('newPasswordConfirm',this)">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full" id="newPassBtn">
        <span id="newPassBtnText">Uložit nové heslo</span>
        <span id="newPassBtnLoad" style="display:none">⏳ Ukládám...</span>
      </button>
    </form>

    <div class="auth-divider"><span>nebo</span></div>
    <div class="auth-alt"><a href="login.html">← Zpět na přihlášení</a></div>
  </div>
</div>

<script src="app.js"></script>
<script>
// Zjisti jestli jsme přišli z reset odkazu (URL má #access_token nebo type=recovery)
const hash = window.location.hash;
const params = new URLSearchParams(hash.slice(1));
const accessToken = params.get('access_token');
const type = params.get('type');

if (accessToken && type === 'recovery') {
  // Jsme v kroku 2 – nastavení nového hesla
  document.getElementById('requestForm').style.display = 'none';
  document.getElementById('newPasswordForm').style.display = 'block';
  document.getElementById('pageTitle').textContent = 'Nové heslo';
  document.getElementById('pageSubtitle').textContent = 'Zadej své nové heslo';
  localStorage.setItem('sb_reset_token', accessToken);
}

// KROK 1 – Odeslat reset email
document.getElementById('requestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('resetEmail').value.trim();
  setLoading('request', true);
  document.getElementById('authError').style.display = 'none';

  try {
    const res = await supabaseRequest('auth/v1/recover', 'POST', {
      email,
      gotrue_meta_security: {}
    }, null, 'https://pokemon-trade-ruddy.vercel.app/reset-password.html');
    if (res.error) throw new Error(res.error.message);

    document.getElementById('requestForm').style.display = 'none';
    const s = document.getElementById('authSuccess');
    s.innerHTML = `✅ <strong>Email odeslán!</strong><br>Zkontroluj schránku <strong>${email}</strong> a klikni na odkaz pro obnovení hesla.`;
    s.style.display = 'block';
  } catch(err) {
    showError(err.message);
  }
  setLoading('request', false);
});

// KROK 2 – Nastavit nové heslo
document.getElementById('newPasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass    = document.getElementById('newPassword').value;
  const confirm = document.getElementById('newPasswordConfirm').value;

  if (pass !== confirm) { showError('Hesla se neshodují'); return; }
  if (pass.length < 6)  { showError('Heslo musí mít alespoň 6 znaků'); return; }

  setLoading('newPass', true);
  document.getElementById('authError').style.display = 'none';

  try {
    const token = localStorage.getItem('sb_reset_token') || accessToken;
    const res = await supabaseRequest('auth/v1/user', 'PUT', { password: pass }, token);
    if (res.error) throw new Error(res.error.message);

    localStorage.removeItem('sb_reset_token');
    document.getElementById('newPasswordForm').style.display = 'none';
    const s = document.getElementById('authSuccess');
    s.innerHTML = `✅ <strong>Heslo změněno!</strong><br><a href="login.html">Přihlásit se →</a>`;
    s.style.display = 'block';
  } catch(err) {
    showError('Nepodařilo se změnit heslo: ' + err.message);
  }
  setLoading('newPass', false);
});

function showError(msg) {
  const el = document.getElementById('authError');
  el.textContent = '⚠️ ' + msg;
  el.style.display = 'block';
}

function toggleEye(id, btn) {
  const inp = document.getElementById(id);
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
  btn.classList.toggle('active', show);
}

function setLoading(prefix, on) {
  document.getElementById(prefix+'BtnText').style.display = on ? 'none' : '';
  document.getElementById(prefix+'BtnLoad').style.display = on ? '' : 'none';
  document.getElementById(prefix+'Btn').disabled = on;
}
</script>

<style>
/* ═══ WALLPAPER BACKGROUND ═══ */
body { background: #06040c !important; overflow-x: hidden; }
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("wallpaper.png");
  background-size: cover;
  background-position: center 30%;
  background-repeat: no-repeat;
  filter: brightness(0.22) saturate(0.6);
}
body::after {
  content: "";
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 60%, rgba(255,80,0,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 60%, rgba(30,80,255,0.08) 0%, transparent 70%),
    linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.6) 100%);
}
.auth-success {
  background: rgba(34,197,94,.12);
  border: 1px solid rgba(34,197,94,.3);
  color: #86efac;
  border-radius: 10px;
  padding: 1rem 1.2rem;
  font-size: .9rem;
  line-height: 1.6;
  margin-bottom: 1rem;
}
.auth-success a { color: #fbbf24; }
</style>
<script src="site-tracking.js"></script>
</body>
</html>
