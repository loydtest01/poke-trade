<!DOCTYPE html>
<html lang="cs">
<head>
  <link rel="icon" type="image/png" href="pokemon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil – PokéTrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<style>
:root {
  --yellow:#f5c842;--text:#f0ece4;--text2:rgba(240,236,228,0.65);--text3:rgba(240,236,228,0.35);
  --bg1:rgba(12,10,18,0.88);--bg2:rgba(18,14,26,0.92);--bg3:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --green:#4ade80;--blue:#74b4ff;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06040c;font-family:'DM Sans',sans-serif;color:var(--text);overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url('wallpaper.png');background-size:cover;background-position:center 30%;
  filter:brightness(0.22) saturate(0.6);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 20% 60%,rgba(255,80,0,0.08) 0%,transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 60%,rgba(30,80,255,0.08) 0%,transparent 70%),
    linear-gradient(to bottom,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0.1) 50%,rgba(0,0,0,0.6) 100%);
}
.app-topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(8,4,6,0.82);border-bottom:1px solid rgba(245,200,66,0.12);
  backdrop-filter:blur(18px);display:flex;align-items:center;height:56px;padding:0 20px;gap:0;
}
.app-logo{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;text-decoration:none;margin-right:28px}
.app-logo strong{color:var(--yellow)}
.nav-lnks{display:flex;gap:2px;flex:1}
.nav-lnks a{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;transition:all .15s}
.nav-lnks a:hover{background:rgba(255,255,255,0.07);color:var(--text)}
.nav-lnks a.active{background:rgba(245,200,66,0.12);color:var(--yellow)}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:20px;padding:4px 12px 4px 6px;font-size:13px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.btn-nav{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,0.18);background:transparent;color:var(--text2);text-decoration:none;cursor:pointer;transition:all .15s}
.btn-nav:hover{background:rgba(255,255,255,0.08);color:var(--text)}

.page-wrap{position:relative;z-index:1;padding:24px 20px;max-width:960px;margin:0 auto}

.profile-hero{
  background:var(--bg1);border:1px solid var(--border);border-radius:18px;
  padding:28px;margin-bottom:20px;backdrop-filter:blur(10px);
  display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;
}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#f5c842,#ff8c00);
  display:flex;align-items:center;justify-content:center;
  font-family:'Unbounded',sans-serif;font-size:28px;font-weight:800;color:#000;
}
.profile-info{flex:1;min-width:200px}
.profile-name{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
.profile-bio{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.profile-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.profile-meta span{display:flex;align-items:center;gap:4px}
.stat-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat-chip{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px}
.stat-chip .val{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:800;color:var(--yellow)}
.stat-chip .lbl{font-size:10px;color:var(--text3);margin-top:2px}
.star-display{display:flex;align-items:center;gap:6px;margin-top:8px}
.stars{display:flex;gap:2px}
.star{font-size:16px;line-height:1}
.star.full{color:#f5c842}
.star.half{color:#f5c842;opacity:.5}
.star.empty{color:var(--text3)}
.rating-num{font-size:18px;font-weight:700;color:var(--text)}
.rating-count{font-size:12px;color:var(--text3)}

.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab-btn{
  padding:8px 18px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text2);transition:all .15s;
}
.tab-btn:hover{background:rgba(255,255,255,0.06);color:var(--text)}
.tab-btn.act{background:rgba(245,200,66,0.12);border-color:rgba(245,200,66,0.25);color:var(--yellow)}
.tab-content{display:none}
.tab-content.show{display:block}

/* Ratings section */
.ratings-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.rating-summary{
  background:var(--bg1);border:1px solid var(--border);border-radius:14px;
  padding:18px;backdrop-filter:blur(8px);
}
.rating-summary h3{font-size:14px;font-weight:600;margin-bottom:14px;color:var(--text)}
.rating-big{text-align:center;margin-bottom:16px}
.rating-big .num{font-family:'Unbounded',sans-serif;font-size:40px;font-weight:800;color:var(--yellow)}
.rating-big .of{font-size:13px;color:var(--text3)}
.rating-bars{display:flex;flex-direction:column;gap:10px}
.rbar-row{display:flex;flex-direction:column;gap:4px}
.rbar-label{font-size:11px;color:var(--text2);display:flex;justify-content:space-between}
.rbar-label span{color:var(--yellow);font-weight:600}
.rbar-track{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.rbar-fill{height:100%;background:linear-gradient(90deg,#f5c842,#ff8c00);border-radius:3px;transition:width .6s ease}
.histogram{display:flex;flex-direction:column;gap:4px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.hist-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.hist-bar{flex:1;height:5px;background:rgba(255,255,255,0.07);border-radius:3px;overflow:hidden}
.hist-fill{height:100%;background:rgba(245,200,66,0.5);border-radius:3px}

.reviews-list{display:flex;flex-direction:column;gap:10px}
.review-card{
  background:var(--bg1);border:1px solid var(--border);border-radius:12px;
  padding:14px;backdrop-filter:blur(6px);
}
.review-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.reviewer-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.reviewer-name{font-size:13px;font-weight:600;color:var(--text)}
.review-date{font-size:11px;color:var(--text3);margin-left:auto}
.review-role{font-size:10px;color:var(--text3);background:rgba(255,255,255,0.06);padding:2px 7px;border-radius:20px;margin-left:4px}
.review-stars{margin-bottom:6px}
.review-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.review-cat{font-size:10px;color:var(--text3);background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:2px 8px;border-radius:6px}
.review-cat span{color:var(--yellow)}
.review-text{font-size:13px;color:var(--text2);line-height:1.6}

/* Rate form */
.rate-form{
  background:var(--bg2);border:1px solid rgba(245,200,66,0.2);border-radius:14px;
  padding:18px;margin-bottom:16px;display:none;flex-direction:column;gap:12px;
}
.rate-form.show{display:flex}
.rate-row{display:flex;flex-direction:column;gap:6px}
.rate-label{font-size:12px;color:var(--text2)}
.star-picker{display:flex;gap:4px}
.star-pick{font-size:22px;cursor:pointer;color:var(--text3);transition:color .1s;line-height:1}
.star-pick.lit{color:#f5c842}
.rate-textarea{
  padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:13px;outline:none;resize:none;height:70px;
}
.btn-rate{
  padding:10px 20px;border-radius:9px;font-size:13px;font-weight:700;
  border:none;background:linear-gradient(135deg,var(--yellow),#ff8c00);color:#000;cursor:pointer;
}

/* Listings in profile */
.profile-listings{display:flex;flex-direction:column;gap:8px}
.pl-row{
  display:flex;gap:12px;padding:12px;background:var(--bg1);border:1px solid var(--border);
  border-radius:12px;cursor:pointer;transition:border-color .15s;backdrop-filter:blur(6px);
  text-decoration:none;color:inherit;
}
.pl-row:hover{border-color:var(--border2)}
.pl-thumb{width:48px;height:66px;border-radius:6px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text3)}
.pl-thumb img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1;min-width:0}
.pl-title{font-size:14px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-meta{font-size:12px;color:var(--text3)}
.pl-price{font-size:15px;font-weight:700;flex-shrink:0;align-self:center}
.tag{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.tag-sell{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.25)}
.tag-trade{background:rgba(74,158,255,0.15);color:#74b4ff;border:1px solid rgba(74,158,255,0.25)}

.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.empty div{font-size:36px;margin-bottom:10px}

.msg-btn{
  padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid rgba(74,158,255,0.3);background:transparent;color:var(--blue);transition:all .15s;
}
.msg-btn:hover{background:rgba(74,158,255,0.08)}
</style>
</head>
<body>

<header class="app-topbar">
  <a href="index.html" class="app-logo">
    <img src="pokemon.png" alt="P" style="width:28px;height:28px;object-fit:contain;vertical-align:middle;border-radius:6px">
    Poké<strong>Trade</strong>
  </a>
  <nav class="nav-lnks">
    <a href="marketplace.html">Nabídky</a>
    <a href="album.html">🔄 Album výměny</a>
    <a href="moje-album.html">🎴 Moje album</a>
    <a href="compare.html">Porovnat alba</a>
  </nav>
  <div class="topbar-right">
    <div class="user-chip" id="userChip" style="display:none">
      <div class="user-avatar" id="userAvatar">?</div>
      <span id="userName"></span>
    </div>
    <a href="login.html" id="loginLink" class="btn-nav">Přihlásit se</a>
    <button id="logoutBtn" onclick="doLogout()" class="btn-nav" style="display:none">Odhlásit</button>
  </div>
</header>

<div class="page-wrap">
  <div id="profileHero" class="profile-hero">
    <div class="profile-avatar" id="heroAvatar">?</div>
    <div class="profile-info">
      <div class="profile-name" id="heroName">Načítám…</div>
      <div class="profile-bio" id="heroBio"></div>
      <div class="profile-meta" id="heroMeta"></div>
      <div class="star-display" id="heroStars"></div>
      <div class="stat-chips" id="heroStats"></div>
    </div>
    <div style="margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
      <button class="msg-btn" id="msgProfileBtn" style="display:none" onclick="openMsgToUser()">✉️ Napsat zprávu</button>
      <button id="rateBtn" style="display:none" class="btn-rate" onclick="toggleRateForm()">⭐ Ohodnotit</button>
    </div>
  </div>

  <!-- Rate form -->
  <div class="rate-form" id="rateForm">
    <div style="font-size:15px;font-weight:600;color:var(--text)">Ohodnotit uživatele</div>
    <div style="font-size:12px;color:var(--text3)" id="rateFormNote">Hodnotit lze jen uživatele se kterým jste dokončili transakci.</div>
    <div id="rateCatsWrapper"></div>
    <div class="rate-row">
      <div class="rate-label">Komentář</div>
      <textarea class="rate-textarea" id="rateComment" placeholder="Popište svou zkušenost s tímto uživatelem..."></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-rate" onclick="submitRating()">Odeslat hodnocení</button>
      <button onclick="toggleRateForm()" style="padding:10px 16px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:13px">Zrušit</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn act" onclick="showTab('listings')">Nabídky</button>
    <button class="tab-btn" onclick="showTab('demands')">Poptávky</button>
    <button class="tab-btn" onclick="showTab('ratings')">Hodnocení</button>
  </div>

  <div id="tab-listings" class="tab-content show">
    <div id="profileListings" class="profile-listings">
      <div class="empty"><div>🃏</div>Načítám nabídky…</div>
    </div>
  </div>

  <div id="tab-demands" class="tab-content">
    <div id="profileDemands" class="profile-listings">
      <div class="empty"><div>🔍</div>Načítám poptávky…</div>
    </div>
  </div>

  <div id="tab-ratings" class="tab-content">
    <div class="ratings-grid" id="ratingsGrid">
      <div class="rating-summary">
        <h3>Celkové hodnocení</h3>
        <div class="rating-big">
          <div class="num" id="ratingBig">—</div>
          <div class="of">z 5.0</div>
          <div style="display:flex;justify-content:center;margin-top:6px" id="ratingBigStars"></div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px" id="ratingBigCount"></div>
        </div>
        <div class="rating-bars" id="ratingBars"></div>
        <div class="histogram" id="ratingHistogram"></div>
      </div>
      <div class="reviews-list" id="reviewsList">
        <div class="empty"><div>⭐</div>Zatím žádná hodnocení</div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const SB_URL  = typeof SUPABASE_URL  !== 'undefined' ? SUPABASE_URL  : 'https://xrduqwrinzvmpixgmqta.supabase.co';
const SB_ANON = typeof SUPABASE_ANON !== 'undefined' ? SUPABASE_ANON : 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyZHVxd3Jpbnp2bXBpeGdtcXRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDI0MjksImV4cCI6MjA5MDk3ODQyOX0.2p404Vy77CH_MsvQlnpxaO0H-KlSSt_oJlaFrmttFXs';

async function sbReq(path,method='GET',body=null,token=null){
  const h={'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+(token||SB_ANON)};
  if(['POST','PATCH'].includes(method)&&!path.startsWith('auth/')) h['Prefer']='return=representation';
  const res=await fetch(`${SB_URL}/${path}`,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const text=await res.text(); const data=text?JSON.parse(text):{};
  if(!res.ok) return{_err:data.message||data.error||'HTTP '+res.status};
  return data;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ── Auth ──────────────────────────────────────────────────────
let myToken=null,myUserId=null,myUsername=null;
const sbUser=(()=>{try{return JSON.parse(localStorage.getItem('sb_user')||'null')}catch{return null}})();
myToken=localStorage.getItem('sb_token');
myUserId=sbUser?.id;
myUsername=sbUser?.user_metadata?.username||sbUser?.email?.split('@')[0]||'';
if(myToken&&myUserId){
  document.getElementById('userChip').style.display='';
  document.getElementById('loginLink').style.display='none';
  document.getElementById('logoutBtn').style.display='';
  document.getElementById('userName').textContent=myUsername;
  document.getElementById('userAvatar').textContent=(myUsername[0]||'?').toUpperCase();
}
function doLogout(){['sb_token','sb_user','sb_refresh_token'].forEach(k=>localStorage.removeItem(k));location.href='login.html'}

// ── Load profile ──────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const profileUsername = params.get('user') || myUsername;
let profileUserId = null;
let ratingStars={communication:0,delivery_speed:0,description_accuracy:0,payment_speed:0,item_pickup:0};
let pendingOfferId=null,ratingRole=null;

(async function loadProfile(){
  // Load profile by username
  const pRes = await sbReq(`rest/v1/profiles?username=eq.${encodeURIComponent(profileUsername)}&select=*&limit=1`);
  const profile = Array.isArray(pRes)&&pRes[0] ? pRes[0] : null;
  if(!profile){
    document.getElementById('heroName').textContent='Uživatel nenalezen';
    return;
  }
  profileUserId=profile.id;
  const isMe = myUserId===profileUserId;

  // Hero
  document.getElementById('heroAvatar').textContent=(profileUsername[0]||'?').toUpperCase().charAt(0);
  document.getElementById('heroName').textContent=profileUsername;
  if(profile.bio) document.getElementById('heroBio').textContent=profile.bio;
  const since=profile.member_since||profile.created_at;
  document.getElementById('heroMeta').innerHTML=`
    <span>📍 ${esc(profile.location||'—')}</span>
    <span>📅 Člen od ${since?new Date(since).toLocaleDateString('cs'):'?'}</span>`;

  if(!isMe){
    document.getElementById('msgProfileBtn').style.display='';
    document.getElementById('rateBtn').style.display='';
  }

  // Stats
  const stats=await sbReq(`rest/v1/rpc/get_profile_stats`,'POST',{p_user_id:profileUserId});
  document.getElementById('heroStats').innerHTML=`
    <div class="stat-chip"><div class="val">${stats.listing_count||0}</div><div class="lbl">Nabídky</div></div>
    <div class="stat-chip"><div class="val">${stats.trade_count||0}</div><div class="lbl">Výměny</div></div>
    <div class="stat-chip"><div class="val">${stats.demand_count||0}</div><div class="lbl">Poptávky</div></div>
    <div class="stat-chip"><div class="val">${stats.rating_count||0}</div><div class="lbl">Hodnocení</div></div>`;

  // Ratings summary
  const rStats=await sbReq(`rest/v1/user_rating_stats?user_id=eq.${profileUserId}&select=*&limit=1`);
  const rs=Array.isArray(rStats)&&rStats[0]?rStats[0]:null;
  if(rs&&rs.total_ratings>0){
    const avg=parseFloat(rs.avg_overall)||0;
    document.getElementById('heroStars').innerHTML=starsHtml(avg)+`<span class="rating-num" style="margin-left:8px">${avg.toFixed(1)}</span><span class="rating-count" style="margin-left:4px">(${rs.total_ratings} hodnocení)</span>`;
    document.getElementById('ratingBig').textContent=avg.toFixed(1);
    document.getElementById('ratingBigStars').innerHTML=starsHtml(avg);
    document.getElementById('ratingBigCount').textContent=rs.total_ratings+' hodnocení';
    renderRatingBars(rs);
    renderHistogram(rs);
  } else {
    document.getElementById('heroStars').innerHTML='<span style="font-size:12px;color:var(--text3)">Zatím žádné hodnocení</span>';
    document.getElementById('ratingBig').textContent='—';
  }

  // Determine rating role (is viewer buyer or seller?)
  if(myToken&&myUserId&&!isMe) await checkRatingEligibility();

  loadListings();
  loadDemands();
  loadRatings();
})();

function starsHtml(val){
  let html='<div class="stars">';
  for(let i=1;i<=5;i++){
    if(val>=i) html+='<span class="star full">★</span>';
    else if(val>=i-0.5) html+='<span class="star half">★</span>';
    else html+='<span class="star empty">★</span>';
  }
  return html+'</div>';
}

function renderRatingBars(rs){
  const cats=[
    ['Komunikace',rs.pct_communication,'seller'],
    ['Rychlost dodání',rs.pct_delivery_speed,'seller'],
    ['Přesnost popisu',rs.pct_description_accuracy,'seller'],
    ['Rychlost platby',rs.pct_payment_speed,'buyer'],
    ['Převzetí',rs.pct_item_pickup,'buyer'],
  ];
  document.getElementById('ratingBars').innerHTML=cats.filter(([,v])=>v!=null&&v>0).map(([label,pct])=>`
    <div class="rbar-row">
      <div class="rbar-label">${label}<span>${pct||0}%</span></div>
      <div class="rbar-track"><div class="rbar-fill" style="width:${pct||0}%"></div></div>
    </div>`).join('');
}

function renderHistogram(rs){
  const total=rs.total_ratings||1;
  const rows=[[5,rs.five_star||0],[4,rs.four_star||0],[3,rs.three_star||0],[1,rs.low_star||0]];
  document.getElementById('ratingHistogram').innerHTML=rows.map(([stars,count])=>`
    <div class="hist-row">
      <span style="min-width:14px">${stars}★</span>
      <div class="hist-bar"><div class="hist-fill" style="width:${Math.round(count/total*100)}%"></div></div>
      <span style="min-width:20px;text-align:right">${count}</span>
    </div>`).join('');
}

async function checkRatingEligibility(){
  // Check if there's a completed offer between viewer and this user
  const res=await sbReq(
    `rest/v1/offers?status=eq.accepted&select=id,seller_id,buyer_id,buyer_rated,seller_rated&or=(seller_id.eq.${myUserId},buyer_id.eq.${myUserId})&limit=10`,
    'GET',null,myToken
  );
  if(!Array.isArray(res)) return;
  const offer=res.find(o=>(o.seller_id===profileUserId||o.buyer_id===profileUserId));
  if(offer){
    pendingOfferId=offer.id;
    ratingRole=offer.seller_id===myUserId?'seller':'buyer';
    buildRateForm(ratingRole);
  }
}

function buildRateForm(role){
  const cats = role==='buyer'
    ? [
        {key:'communication',label:'Komunikace',hint:'Reagoval rychle a srozumitelně?'},
        {key:'delivery_speed',label:'Rychlost dodání',hint:'Odeslal kartu rychle po dohodě?'},
        {key:'description_accuracy',label:'Přesnost popisu',hint:'Odpovídal stav karty popisu?'},
      ]
    : [
        {key:'payment_speed',label:'Rychlost platby',hint:'Poslal peníze včas?'},
        {key:'item_pickup',label:'Převzetí',hint:'Potvrdil příjem zásilky?'},
      ];
  document.getElementById('rateCatsWrapper').innerHTML=cats.map(c=>`
    <div class="rate-row">
      <div class="rate-label">${c.label} <span style="color:var(--text3);font-size:11px">— ${c.hint}</span></div>
      <div class="star-picker" id="sp_${c.key}" data-key="${c.key}">
        ${[1,2,3,4,5].map(i=>`<span class="star-pick" data-val="${i}" onclick="setStarPick('${c.key}',${i})">★</span>`).join('')}
      </div>
    </div>`).join('');
}

function setStarPick(key,val){
  ratingStars[key]=val;
  document.querySelectorAll(`#sp_${key} .star-pick`).forEach((s,i)=>{
    s.classList.toggle('lit',i<val);
  });
}

function toggleRateForm(){
  document.getElementById('rateForm').classList.toggle('show');
}

async function submitRating(){
  if(!myToken){alert('Přihlas se.');return}
  const comment=document.getElementById('rateComment').value.trim();
  const role=ratingRole||'buyer';
  const payload={
    reviewer_id:myUserId,reviewed_id:profileUserId,
    reviewer_username:myUsername,reviewed_username:profileUsername,
    role,comment:comment||null,
  };
  if(role==='buyer'){
    payload.communication=ratingStars.communication||3;
    payload.delivery_speed=ratingStars.delivery_speed||3;
    payload.description_accuracy=ratingStars.description_accuracy||3;
  } else {
    payload.payment_speed=ratingStars.payment_speed||3;
    payload.item_pickup=ratingStars.item_pickup||3;
  }
  if(pendingOfferId) payload.offer_id=pendingOfferId;
  const res=await sbReq('rest/v1/ratings','POST',payload,myToken);
  if(res._err){alert('Chyba: '+res._err);return}
  alert('Hodnocení odesláno!');
  toggleRateForm();
  location.reload();
}

// ── Listings ──────────────────────────────────────────────────
async function loadListings(){
  if(!profileUserId) return;
  const res=await sbReq(`rest/v1/listings?user_id=eq.${profileUserId}&status=eq.active&select=*&order=created_at.desc`);
  const wrap=document.getElementById('profileListings');
  if(!Array.isArray(res)||!res.length){
    wrap.innerHTML='<div class="empty"><div>🃏</div>Žádné aktivní nabídky</div>';
    return;
  }
  wrap.innerHTML=res.map(l=>{
    const cards=l.cards_data||[];const first=cards[0]||{};
    const name=l.card_name||first.name||l.title||'?';
    const img=l.api_image_url||first.imageUrl||first.apiSmall||first.images?.small||'';
    const price=l.price_czk;
    return `<a class="pl-row" href="marketplace.html?listing=${esc(l.id)}">
      <div class="pl-thumb">${img?`<img src="${esc(img)}" loading="lazy">`:'🃏'}</div>
      <div class="pl-info">
        <div class="pl-title">${esc(name)}</div>
        <div class="pl-meta">${esc(l.card_set||'')}${l.card_condition?' · '+esc(l.card_condition):''} · ${timeAgo(l.created_at)}</div>
        <div style="display:flex;gap:5px;margin-top:5px">
          ${price>0?'<span class="tag tag-sell">Prodej</span>':''}
          ${l.allow_trade?'<span class="tag tag-trade">Výměna</span>':''}
        </div>
      </div>
      <div class="pl-price">${price?price.toLocaleString('cs')+' Kč':'Výměna'}</div>
    </a>`;
  }).join('');
}

async function loadDemands(){
  if(!profileUserId) return;
  const res=await sbReq(`rest/v1/demands?user_id=eq.${profileUserId}&status=eq.active&select=*&order=created_at.desc`);
  const wrap=document.getElementById('profileDemands');
  if(!Array.isArray(res)||!res.length){
    wrap.innerHTML='<div class="empty"><div>🔍</div>Žádné aktivní poptávky</div>';
    return;
  }
  wrap.innerHTML=res.map(d=>`
    <div class="pl-row" style="cursor:default">
      <div class="pl-thumb" style="display:flex;align-items:center;justify-content:center;font-size:22px">🔍</div>
      <div class="pl-info">
        <div class="pl-title">${esc(d.card_name)}</div>
        <div class="pl-meta">${esc(d.card_set||'Libovolná série')}${d.card_type?' · '+esc(d.card_type):''} · ${timeAgo(d.created_at)}</div>
        ${d.description?`<div style="font-size:12px;color:var(--text3);margin-top:4px">${esc(d.description)}</div>`:''}
      </div>
      <div class="pl-price">${d.max_price_czk?'max '+d.max_price_czk.toLocaleString('cs')+' Kč':'Dohodou'}</div>
    </div>`).join('');
}

async function loadRatings(){
  if(!profileUserId) return;
  const res=await sbReq(`rest/v1/ratings?reviewed_id=eq.${profileUserId}&select=*&order=created_at.desc&limit=20`);
  const wrap=document.getElementById('reviewsList');
  if(!Array.isArray(res)||!res.length){
    wrap.innerHTML='<div class="empty"><div>⭐</div>Zatím žádná hodnocení</div>';
    return;
  }
  wrap.innerHTML=res.map(r=>{
    const isBuyer=r.role==='buyer';
    const cats=isBuyer
      ? [['Komunikace',r.communication],['Dodání',r.delivery_speed],['Přesnost',r.description_accuracy]]
      : [['Platba',r.payment_speed],['Převzetí',r.item_pickup]];
    return `<div class="review-card">
      <div class="review-header">
        <div class="reviewer-avatar">${(r.reviewer_username||'?')[0].toUpperCase()}</div>
        <div>
          <div style="display:flex;align-items:center;gap:6px">
            <a href="profile.html?user=${esc(r.reviewer_username)}" style="color:var(--text);text-decoration:none;font-size:13px;font-weight:600">${esc(r.reviewer_username||'?')}</a>
            <span class="review-role">${isBuyer?'kupující':'prodejce'}</span>
          </div>
        </div>
        <div class="review-date">${new Date(r.created_at).toLocaleDateString('cs')}</div>
      </div>
      <div class="review-stars">${starsHtml(r.overall||3)}</div>
      <div class="review-cats">
        ${cats.map(([l,v])=>`<span class="review-cat">${l}: <span>${v||'?'}★</span></span>`).join('')}
      </div>
      ${r.comment?`<div class="review-text">${esc(r.comment)}</div>`:''}
    </div>`;
  }).join('');
}

function openMsgToUser(){
  window.location.href=`marketplace.html?msg=${encodeURIComponent(profileUsername)}`;
}

function showTab(name){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('act',['listings','demands','ratings'][i]===name);
  });
  ['listings','demands','ratings'].forEach(n=>{
    document.getElementById('tab-'+n).classList.toggle('show',n===name);
  });
}

function timeAgo(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<60) return m+'m';if(m<1440) return Math.floor(m/60)+'h';
  return Math.floor(m/1440)+'d';
}
